name: Deploy GitHub Pages

on:
  # Deploy whenever the site content changes on main
  push:
    branches: [main]
    paths:
      - index.html
      - README.md
      - LICENSE
      - .github/workflows/deploy-pages.yml
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Minimum permissions required by the Pages deployment actions
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deploy finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site folder
        run: |
          mkdir -p _site
          cp index.html README.md _site/
          [ -f LICENSE ] && cp LICENSE _site/ || true
          # Serve files as-is (no Jekyll processing)
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
